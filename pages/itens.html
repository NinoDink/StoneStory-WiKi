<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Story RPG - Wiki</title>
    <!-- CSS Bootstrap 5 (Atualizado) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../Styles/header.css">
    <link rel="stylesheet" href="../Styles/styles.css">
    <link rel="stylesheet" href="../Styles/itens-carrosel.css">
</head>
<body>
    <header class="wiki-header py-3">
        <div class="container"> 
            <div class="row align-items-center justify-content-between position-relative">
                <div class="col-auto">
                    <a href="#" class="d-inline-block">
                        <img src="../img/logo.png" alt="Stone Story Wiki Logo" class="img-fluid wiki-logo" width="200">
                    </a>
                </div>

                <nav class="position-absolute start-50 translate-middle-x w-auto">
                    <ul class="nav wiki-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="./pages/itens.html">Itens</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./pages/locais.html">Locais</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./pages/quests.html">Quests</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./pages/stonescript.html">Stonescript</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="carousel-container">
            <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>

                <div class="carousel-inner rounded-3 border border-secondary">
                    <div class="carousel-item active" data-bs-interval="5000">
                        <img src="../img/carrosel-itens1.png" class="d-block w-100" alt="Item 1">
                    </div>
                    <div class="carousel-item" data-bs-interval="5000">
                        <img src="../img/carrosel-itens2.png" class="d-block w-100" alt="Item 2">
                    </div>
                    <div class="carousel-item" data-bs-interval="5000">
                        <img src="../img/carrosel-itens3.png" class="d-block w-100" alt="Item 3">
                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Próximo</span>
                </button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
